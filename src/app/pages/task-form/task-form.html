
<div class="container py-5 main-container page-background">

  <div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-6">

      <div class="card form-card">

        <div class="card-body form-card-body">

          <h2 class="form-title">
            Add New Task
          </h2>

          <form
            class="task-form"
            [formGroup]="taskForm"
            (ngSubmit)="onSubmit()"
          >

            <mat-form-field
              appearance="outline"
              class="form-field"
            >
              <mat-label>Task Title</mat-label>

              <input
                matInput
                class="form-input"
                type="text"
                formControlName="title"
                placeholder="Enter task title"
              >

              @if (
                taskForm.controls.title.touched &&
                taskForm.controls.title.invalid
              ) {
                <mat-error class="form-error">
                  Title is required
                </mat-error>
              }

            </mat-form-field>


            <mat-form-field
              appearance="outline"
              class="form-field"
            >
              <mat-label>Description</mat-label>

              <textarea
                matInput
                class="form-textarea"
                rows="4"
                formControlName="desc"
                placeholder="Enter task description"
              ></textarea>

              @if (
                taskForm.controls.desc.touched &&
                taskForm.controls.desc.invalid
              ) {
                <mat-error class="form-error">
                  Description is required
                </mat-error>
              }

            </mat-form-field>


            <div class="form-checkbox-wrapper">

              <mat-checkbox
                class="form-checkbox"
                formControlName="completed"
              >
                Task Completed
              </mat-checkbox>

            </div>


            <button
              mat-raised-button
              type="submit"
              class="form-submit-button"
            >
              Add Task
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
