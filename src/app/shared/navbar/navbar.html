<nav class="navbar navbar-expand-lg m-navbar">

  <div class="container m-navbar__container">

    <a
      class="navbar-brand m-navbar__brand"
      routerLink="/"
    >
      Task Manager
    </a>

    <button
      class="navbar-toggler m-navbar__toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse"
      id="navbarNav"
    >

      <ul class="navbar-nav ms-auto m-navbar__nav">

        <li class="nav-item">

          <a
            class="nav-link m-navbar__link"
            routerLink="/"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Home
          </a>

        </li>

        @if (authService.user()) {

          <li class="nav-item">

            <a
              class="nav-link m-navbar__link"
              routerLink="/tasks"
              routerLinkActive="is-active"
            >
              Task List
            </a>

          </li>

          <li class="nav-item">

            <a
              class="nav-link m-navbar__link"
              routerLink="/add-task"
              routerLinkActive="is-active"
            >
              Add Task
            </a>

          </li>

          <li class="nav-item">

            <button
              type="button"
              class="nav-link m-navbar__link"
              (click)="logout()"
            >
              Logout
            </button>

          </li>

        } @else {

          <li class="nav-item">

            <a
              class="nav-link m-navbar__link"
              routerLink="/login"
              routerLinkActive="is-active"
            >
              Login
            </a>

          </li>

          <li class="nav-item">

            <a
              class="nav-link m-navbar__link"
              routerLink="/register"
              routerLinkActive="is-active"
            >
              Register
            </a>

          </li>

        }

      </ul>

    </div>

  </div>

</nav>
