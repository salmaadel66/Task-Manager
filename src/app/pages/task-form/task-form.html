<div class="container py-5 l-page">

  <div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-6">

      <div class="c-card is-auto-height">

        <div class="c-card__body">

          <h2 class="c-card__title">
            Add New Task
          </h2>

          <form
            [formGroup]="taskForm"
            (ngSubmit)="onSubmit()"
          >

            <mat-form-field
              appearance="outline"
              class="c-form__field"
            >
              <mat-label>Task Title</mat-label>

              <input
                matInput
                type="text"
                formControlName="title"
                placeholder="Enter task title"
              >

              @if (
                taskForm.controls.title.touched &&
                taskForm.controls.title.invalid
              ) {
                <mat-error>
                  Title is required
                </mat-error>
              }

            </mat-form-field>


            <mat-form-field
              appearance="outline"
              class="c-form__field"
            >
              <mat-label>Description</mat-label>

              <textarea
                matInput
                rows="4"
                formControlName="desc"
                placeholder="Enter task description"
              ></textarea>

              @if (
                taskForm.controls.desc.touched &&
                taskForm.controls.desc.invalid
              ) {
                <mat-error>
                  Description is required
                </mat-error>
              }

            </mat-form-field>


            <div class="c-form__group">

              <mat-checkbox
                class="c-form__checkbox"
                formControlName="completed"
              >
                Task Completed
              </mat-checkbox>

            </div>


            <button
              mat-raised-button
              type="submit"
              class="c-button is-primary is-block"
            >
              Add Task
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
